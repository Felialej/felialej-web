<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Felialej | Expresado en acordes y letras</title>
  <meta
    name="description"
    content="Felialej. Expresado en acordes y letras. Escucha su música y síguelo en plataformas oficiales."
  />

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Iconos de plataformas -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body>
  <!-- Fondo visual -->
  <div class="background-effects" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Cursor personalizado -->
  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>

  <main class="hub-page">
    <section class="hub-card" aria-label="Enlaces oficiales de Felialej">
      <div class="hub-content">

        <h1 class="artist-name">FELIALEJ</h1>

        <p class="tagline">Expresado en acordes y letras</p>

        <div class="platform-grid">
          <a
            href="https://open.spotify.com/intl-es/artist/2t1Gy01LImkqYBTwyTartn?si=nK4iIxqYTCyqvPfP6fFDLw"
            target="_blank"
            rel="noopener noreferrer"
            class="platform-link primary"
            aria-label="Escuchar a Felialej en Spotify"
          >
            <span class="platform-icon"><i class="fa-brands fa-spotify"></i></span>
            <span class="platform-name">Spotify</span>
            <span class="platform-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
          </a>

          <a
            href="https://music.apple.com/us/artist/felialej/1645318756"
            target="_blank"
            rel="noopener noreferrer"
            class="platform-link primary"
            aria-label="Escuchar a Felialej en Apple Music"
          >
            <span class="platform-icon"><i class="fa-brands fa-apple"></i></span>
            <span class="platform-name">Apple Music</span>
            <span class="platform-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
          </a>

          <a
            href="https://www.youtube.com/@FelialejOficial"
            target="_blank"
            rel="noopener noreferrer"
            class="platform-link primary"
            aria-label="Ver a Felialej en YouTube"
          >
            <span class="platform-icon"><i class="fa-brands fa-youtube"></i></span>
            <span class="platform-name">YouTube</span>
            <span class="platform-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
          </a>

          <a
            href="https://www.instagram.com/felialej_/"
            target="_blank"
            rel="noopener noreferrer"
            class="platform-link"
            aria-label="Seguir a Felialej en Instagram"
          >
            <span class="platform-icon"><i class="fa-brands fa-instagram"></i></span>
            <span class="platform-name">Instagram</span>
            <span class="platform-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
          </a>

          <a
            href="https://www.tiktok.com/@felialej/"
            target="_blank"
            rel="noopener noreferrer"
            class="platform-link"
            aria-label="Seguir a Felialej en TikTok"
          >
            <span class="platform-icon"><i class="fa-brands fa-tiktok"></i></span>
            <span class="platform-name">TikTok</span>
            <span class="platform-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
          </a>

          <a
            href="https://www.deezer.com/br/artist/183437787"
            target="_blank"
            rel="noopener noreferrer"
            class="platform-link"
            aria-label="Escuchar a Felialej en Deezer"
          >
            <span class="platform-icon"><i class="fa-brands fa-deezer"></i></span>
            <span class="platform-name">Deezer</span>
            <span class="platform-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
          </a>
        </div>

        <p class="origin-signature">Origen</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
